name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: calendar_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: application.yml 생성
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.yml << 'EOF'
          spring:
            datasource:
              url: jdbc:mysql://localhost:3306/calendar_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
              username: root
              password: testpassword
              driver-class-name: com.mysql.cj.jdbc.Driver
            jpa:
              hibernate:
                ddl-auto: update
              show-sql: true
              properties:
                hibernate:
                  format_sql: true
            data:
              redis:
                host: localhost
                port: 6379
          jwt:
            secret: thisIsASecretKeyForJwtTokenGenerationAndItMustBeAtLeast256BitsLong
            access-token-expiration: 1800000
            refresh-token-expiration: 604800000
          EOF

      - name: Gradle 빌드 및 테스트
        run: ./gradlew build

      - name: 테스트 결과 확인
        if: always()
        run: ./gradlew test